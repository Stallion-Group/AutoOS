<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Secure Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@400;500&family=Noto+Sans:wght@400;500&display=optional"><style>

:root {
  
  --theme-bg: #faf8f5;              
  --theme-bg-rgb: 250, 248, 245;
  --theme-bg-alpha-60: rgba(250, 248, 245, 0.6);
  --theme-bg-alpha-80: rgba(250, 248, 245, 0.8);
  --theme-bg-alpha-90: rgba(250, 248, 245, 0.9);

  --theme-card-bg: #fefdfc;
  --theme-card-border: rgba(0, 0, 0, 0.06);
  --theme-glass-bg: rgba(249, 247, 243, 0.65);
  --theme-glass-border: rgba(0, 0, 0, 0.08);

  
  --theme-text-primary: #1a1a1a;
  --theme-text-secondary: #555555;

  
  --theme-button-bg: rgba(249, 247, 243, 0.65);
  --theme-button-text: #3a3a3a;
  --theme-button-border: rgba(0, 0, 0, 0.1);
  --theme-input-bg: rgba(249, 247, 243, 0.65);
  --theme-input-border: rgba(0, 0, 0, 0.12);
  --theme-input-text: #1a1a1a;
  --theme-input-placeholder: #777777;
  --theme-badge-bg: rgba(0, 0, 0, 0.04);
  --theme-badge-border: rgba(0, 0, 0, 0.08);

  
  
  --theme-blue: #0d54a8;
  --theme-red: #d51323;
  --theme-yellow: #cf6900;
  --theme-green: #178e66;
  --theme-purple: #6f1cbd;
  --accent-color: #4a4a4a;

  
  --theme-transition: 0.4s ease-in-out;
  --hover-transition: 150ms ease-in-out;
  --theme-glass-blur: 14px;
}

html.theme-dark {
  --theme-bg: #121212;
  --theme-bg-rgb: 18, 18, 18;
  --theme-bg-alpha-60: rgba(18, 18, 18, 0.6);
  --theme-bg-alpha-80: rgba(18, 18, 18, 0.8);
  --theme-bg-alpha-90: rgba(18, 18, 18, 0.9);

  --theme-card-bg: rgba(255, 255, 255, 0.03);
  --theme-card-border: rgba(255, 255, 255, 0.08);
  --theme-glass-bg: rgba(255, 255, 255, 0.04);
  --theme-glass-border: rgba(255, 255, 255, 0.08);

  --theme-text-primary: #fafafa;
  --theme-text-secondary: #a8a29e;

  --theme-blue: #66a7f3;
  --theme-red: #ee3d4c;
  --theme-yellow: #f59e0b;
  --theme-green: #2fbc8b;
  --theme-purple: #bf92e9;
  --accent-color: #8a8a8a;
}




body {
  font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--theme-bg);
  color: var(--theme-text-primary);
  margin: 0;
}

h1, h2, .s-display {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  letter-spacing: -0.01em;
}
h1 { font-size: 2.25rem; }

.s-num, .tabular { font-variant-numeric: tabular-nums; }
.s-currency { font-family: 'Noto Sans', system-ui, sans-serif; }




.s-metric { display: flex; flex-direction: column; gap: 2px; }
.s-metric-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--theme-text-secondary);
}
.s-metric-value { font-size: 28px; font-variant-numeric: tabular-nums; }
.s-metric-note { font-size: 12px; color: var(--theme-text-secondary); }


.s-callout { border-left: 2px solid var(--theme-yellow); padding-left: 16px; }
.s-callout--bad  { border-left-color: var(--theme-red); }
.s-callout--good { border-left-color: var(--theme-green); }
.s-callout-title { font-size: 14px; font-weight: 500; }
.s-callout-body  {
  font-size: 13px; color: var(--theme-text-secondary);
  margin-top: 8px; max-width: 84ch;
}


.s-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.s-table th {
  font-weight: 400; text-align: left; padding-bottom: 8px;
  color: var(--theme-text-secondary);
  border-bottom: 1px solid var(--theme-card-border);
}
.s-table td {
  padding: 8px 0; border-bottom: 1px solid var(--theme-card-border);
}
.s-table td.num { text-align: right; font-variant-numeric: tabular-nums; }


.s-section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--theme-text-secondary); margin-bottom: 12px;
}
</style>
<style>

*{margin:0;padding:0;box-sizing:border-box}
body{font-size:14px;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{padding:44px 0;max-width:430px;width:92%;border-top:1px solid var(--theme-card-border)}
h1{margin-bottom:6px;line-height:1.1}
p.s{color:var(--theme-text-secondary);font-size:13px;margin-bottom:26px}
label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--theme-text-secondary)}
input{width:100%;padding:12px 14px;margin:8px 0 18px;border:1px solid var(--theme-input-border);border-radius:4px;
 font:inherit;background:var(--theme-input-bg);color:var(--theme-input-text)}
input:focus{outline:none;border-color:var(--theme-text-primary)}
button{width:100%;background:var(--theme-text-primary);color:var(--theme-bg);border:none;padding:13px;border-radius:4px;
 font:inherit;font-weight:500;cursor:pointer;transition:opacity var(--hover-transition)}
button:hover{opacity:.85}
.err{color:var(--theme-red);font-size:13px;margin-top:14px;display:none}
.note{margin-top:24px;padding-top:18px;border-top:1px solid var(--theme-card-border);font-size:11.5px;
 color:var(--theme-text-secondary)}
</style></head><body>

 const e=document.getElementById('e'); e.style.display='none';
 try{
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
