name: Deploy AutoOS to stalliongroup.com

on:
  push:
    branches: [main]
    paths:
      - 'r/q7f4/**'
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTPS deploy r/q7f4 to /autoos
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./r/q7f4/
          server-dir: ./public_html/autoos/
